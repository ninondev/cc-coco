name: CI

# Validates the marketplace and the plugin, then runs the mod tests (the kit). Needs no secrets and no
# sign-in: `claude plugin validate` and the kit work offline. The tree has no generator and none of the
# private checks; tools/public-tree.json lists what it leaves out, and the test runner reports those as skipped.
on:
  push:
  pull_request:
  # Run by hand: the Windows job alone, on the test files named, or the whole kit when none are.
  workflow_dispatch:
    inputs:
      windows_tests:
        description: Test files for the Windows job, separated by spaces (empty runs the whole kit)
        type: string
        default: ""

# Read-only token; nothing here writes to the repository.
permissions:
  contents: read

# A newer push to the same branch or pull request replaces a run that is still going; a run by hand
# replaces only an earlier run by hand.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  # Claude Code is installed with Anthropic's native installer pinned to this exact version
  # (https://code.claude.com/docs/en/setup#install-a-specific-version). 1.0 needs 2.1.299 or later; the
  # full kit was run on this one. Raise it on purpose.
  CLAUDE_CODE_VERSION: "2.1.302"
  # The pinned version stays put for the whole run.
  DISABLE_AUTOUPDATER: "1"
  # The kit rebuilds two runtime files in its scratch copy with Bun and TypeScript.
  BUN_VERSION: "1.4.2"
  TYPESCRIPT_VERSION: "5.9.3"
  # Hosted runners are slower than the machine the CPU budgets were measured on. In the 10-17 rehearsal the
  # startup batches went 0.5 % over their budget at 4 on a slow cloud machine; the budgets themselves are
  # measured on the maintainer's Mac.
  COCO_CPU_SCALE: "6"

jobs:
  check:
    name: check (${{ matrix.os }})
    if: github.event_name != 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash # GitHub's bash invocation adds -e and pipefail
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_CODE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Bun and TypeScript
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v$BUN_VERSION"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/typescript"
          cd "$RUNNER_TEMP/typescript"
          "$HOME/.bun/bin/bun" add "typescript@$TYPESCRIPT_VERSION"
          echo "COCO_TYPESCRIPT=$RUNNER_TEMP/typescript/node_modules/typescript/lib/typescript.js" >> "$GITHUB_ENV"

      - name: Check the installed versions
        run: |
          claude --version
          test "$(claude --version | cut -d' ' -f1)" = "$CLAUDE_CODE_VERSION"
          test "$(bun --version)" = "$BUN_VERSION"
          test -f "$COCO_TYPESCRIPT"

      - name: Validate the marketplace
        run: claude plugin validate .

      - name: Validate the plugin
        run: claude plugin validate plugin

      - name: Shell scripts parse
        run: |
          for f in plugin/bin/*.sh scripts/assemble.sh scripts/check.sh; do
            sh -n "$f"
          done

      - name: Run the mod tests
        run: python3 tools/run-tests.py --stage kit

  windows:
    name: check (Windows, experimental)
    runs-on: windows-latest
    # Not tried on a real Windows machine yet; failures are reported without blocking the release.
    continue-on-error: true
    # The whole kit took about two hours here on 10-21, and the Windows-roots matrix runs after it.
    timeout-minutes: 300
    # Python reads and writes files as UTF-8, as on macOS and Linux; Windows' own default cannot read the Chinese in them.
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Claude Code
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "claude-install.ps1"
          Invoke-WebRequest https://claude.ai/install.ps1 -OutFile $installer
          $global:LASTEXITCODE = 0
          & $installer $env:CLAUDE_CODE_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Bun and TypeScript
        run: |
          iex "& {$(irm https://bun.sh/install.ps1)} -Version $env:BUN_VERSION"
          $bun = Join-Path $env:USERPROFILE ".bun\bin"
          $bun | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $ts = Join-Path $env:RUNNER_TEMP "typescript"
          New-Item -ItemType Directory -Force -Path $ts | Out-Null
          Push-Location $ts
          & (Join-Path $bun "bun.exe") add "typescript@$env:TYPESCRIPT_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          "COCO_TYPESCRIPT=$ts\node_modules\typescript\lib\typescript.js" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check the installed version
        run: |
          $version = claude --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output $version
          if (($version -split ' ')[0] -ne $env:CLAUDE_CODE_VERSION) {
            throw "Claude Code version does not match CLAUDE_CODE_VERSION"
          }

      - name: Validate the marketplace
        run: claude plugin validate .

      - name: Validate the plugin
        run: claude plugin validate plugin

      - name: Shell scripts parse
        shell: bash
        run: |
          for f in plugin/bin/*.sh scripts/assemble.sh scripts/check.sh; do
            sh -n "$f"
          done

      - name: Run the mod tests
        env:
          WINDOWS_TESTS: ${{ inputs.windows_tests }}
        run: |
          $chosen = @()
          foreach ($name in ("$env:WINDOWS_TESTS" -split '\s+' | Where-Object { $_ })) { $chosen += @('--test-file', $name) }
          python tools/run-tests.py --stage kit @chosen
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($chosen.Count -eq 0) { python tools/run-tests.py --stage kit --windows-roots }
