<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' data:; font-src 'none'; base-uri 'none'; form-action 'none'">
<title>Coco, an unofficial fan mod for Claude Code</title>
<meta name="description" content="Your cutest coworker. Coco peeks at every bug you hit, and is very smug about it.">
<link rel="icon" href="art/face.png" type="image/png">
<style>
:root{--ground:#FFFFFF;--ink:#231B19;--soft:#6E4A3E;--rule:#E6D3CC;--accent:#9E4123;--rubric:#C75730;
 --stage:#FFFFFF;--stageInk:#1C1716;--stageSoft:#6B6461;--name:#9E4123;--band:#F4E9E4;--btn:#FFFFFF;--btnBorder:#A47E70;
 --primaryBg:#231B19;--primaryInk:#FAEEE9;--chip:#F1DED6;color-scheme:light}
:root[data-theme=dark]{--ground:#1B1615;--ink:#F3E8DE;--soft:#C9AFA2;--rule:#3A2E2B;--accent:#F2A47F;--rubric:#C75730;
 --stage:#100E0D;--stageInk:#EDE6E2;--stageSoft:#A0958F;--name:#D77757;--band:#2A2321;--btn:#241E1C;--btnBorder:#806A61;
 --primaryBg:#F3E8DE;--primaryInk:#1B1615;--chip:#2E2523;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.5 -apple-system,Inter,BlinkMacSystemFont,"Hiragino Sans","PingFang SC","Noto Sans CJK SC","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
::selection{background:#C7573055}
a{color:var(--accent);text-underline-offset:3px}
button,select{font:inherit}
button:focus-visible,select:focus-visible,a:focus-visible,.grip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;background:var(--primaryBg);color:var(--primaryInk);padding:8px 14px;border-radius:8px;z-index:5;text-decoration:none}
.skip:focus{top:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 40px;max-width:1360px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.names{display:flex;align-items:baseline;gap:10px;min-width:0}
.nm{display:flex;gap:8px;align-items:baseline;white-space:nowrap}
.brand b{font-size:17px;font-weight:650;white-space:nowrap}
.brand .alias{font-size:14px;color:var(--soft);font-weight:500}
.brand .sub{color:var(--soft);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.face{width:35px;height:32px;flex:none;image-rendering:pixelated}
.tools{display:flex;align-items:center;gap:10px}
button,.sel,.install{font-size:14px;color:var(--ink);background:var(--btn);border:1px solid var(--btnBorder);border-radius:8px;padding:6px 12px;line-height:1.3;cursor:pointer}
.sel{max-width:200px;min-height:34px;appearance:none;-webkit-appearance:none;padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,var(--soft) 50%),linear-gradient(135deg,var(--soft) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.install{background:var(--primaryBg);color:var(--primaryInk);border-color:var(--primaryBg);font-weight:600;padding:7px 16px;text-decoration:none;display:inline-flex;align-items:center;min-height:34px}
.seg{display:inline-flex;border:1px solid var(--btnBorder);border-radius:8px;overflow:hidden;background:var(--btn)}
.seg button{border:0;border-radius:0;background:none;color:var(--soft)}
.seg button[aria-pressed=true]{background:var(--chip);color:var(--ink);font-weight:600}
.hero{max-width:1360px;margin:0 auto;padding:18px 40px 6px}
.hero h1{font-size:34px;line-height:1.15;margin:0;font-weight:700;letter-spacing:-.01em}
.hero p{margin:8px 0 0;color:var(--soft);font-size:17px;max-width:60ch}
.main{max-width:1360px;margin:0 auto;padding:22px 40px 24px;display:grid;grid-template-columns:minmax(0,1fr) 340px;column-gap:44px;align-items:start}
.main>*{grid-column:1;min-width:0}
.main>.cues{grid-column:2;grid-row:1 / span 8}
.tabs{display:flex;gap:4px;margin:0 0 12px}
.tab{border:0;background:none;color:var(--soft);padding:6px 12px;border-radius:8px;white-space:nowrap}
.tab.on{background:var(--chip);color:var(--ink);font-weight:600}
.stage{min-width:0}
.surtitle{font-size:19px;line-height:1.35;margin:0 0 10px;max-width:40ch}
.frame{background:var(--stage);color:var(--stageInk);border:1px solid var(--rule);border-radius:14px;padding:34px 26px 22px;position:relative;overflow:hidden}
.frame.book{padding:22px 26px}
.frame.terminal{display:flex;flex-direction:column;justify-content:flex-end}
.inner{max-width:100%}
.inner.term{color:var(--stageInk)}
.inner.desk{font:14px/20px -apple-system,Inter,BlinkMacSystemFont,"Hiragino Sans","PingFang SC","Noto Sans CJK SC","Segoe UI",sans-serif;color:var(--stageInk);max-width:100%}
.grip{position:absolute;right:4px;top:50%;width:10px;height:52px;margin-top:-26px;border-radius:5px;background:var(--rubric);cursor:ew-resize;touch-action:none}
.grip[hidden]{display:none}
.grip::before,.grip::after{content:"";position:absolute;left:3px;width:4px;height:1.5px;background:#FAEEE9;border-radius:1px;top:23px}
.grip::after{top:28px}
.prompt{margin:0 14px;border:1px dashed var(--rule);border-top:0;border-radius:0 0 10px 10px;min-height:34px;display:flex;align-items:center;padding:6px 14px;font-size:12px;color:var(--soft)}
.prompt[hidden]{display:none}
.caprow{display:flex;justify-content:space-between;gap:16px;align-items:baseline;margin-top:12px}
.caption{font-size:13px;color:var(--soft);margin:0 2px;max-width:80ch}
.readout{font-size:12px;color:var(--soft);white-space:nowrap;font-variant-numeric:tabular-nums}
.keyrow{margin:8px 2px 0;font-size:12.5px;color:var(--soft)}
.chips{margin-top:18px}
.chips[hidden]{display:none}
.chipgroup{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.chipgroup[hidden]{display:none}
.chiplabel{font-size:13px;font-weight:600;color:var(--soft);margin-right:4px}
.chip{font-size:13px;padding:5px 10px;border-radius:8px}
.chip.more::after{content:"";display:inline-block;width:6px;height:6px;border-right:1.5px solid var(--soft);border-bottom:1.5px solid var(--soft);transform:rotate(-45deg);margin-left:9px}
.chip.more[aria-expanded=true]::after{transform:rotate(45deg) translateY(-2px)}
.costs{margin-top:30px;padding-top:18px;border-top:1px solid var(--rule)}
.costs:empty{display:none}
.costs h2{font-size:15px;margin:0 0 8px}
.costs p{margin:3px 0;font-size:15px}
.cues h2{font-size:15px;margin:2px 0 2px;font-weight:650}
.cues .dur{color:var(--soft);font-size:13px;margin:0 0 12px}
.cuelist{list-style:none;margin:0;padding:0}
.cuelist li{position:relative;display:block}
.cue{display:grid;grid-template-columns:34px 1fr;gap:4px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:4px 0;font-size:14px;line-height:1.45;color:var(--soft);cursor:pointer}
.cue .n{font-variant-numeric:tabular-nums;text-align:right;padding-right:8px}
.cuelist li.past .cue{color:var(--ink)}
.cuelist li.now .cue{color:var(--ink);font-weight:650}
.cuelist li.now .n{visibility:hidden}
.cuelist li[hidden]{display:none}
.cuemark{position:absolute;left:12px;top:6px;pointer-events:none;line-height:0}
.cuemark img{display:block;image-rendering:pixelated}
.allcues{display:none;margin-top:6px;border:0;background:none;color:var(--accent);text-decoration:underline;text-underline-offset:3px;padding:6px 0;font-size:13px}
.controls{display:flex;gap:8px;margin:16px 0 22px;flex-wrap:wrap}
.ctl{padding:7px 16px}
.ctl.primary{background:var(--primaryBg);color:var(--primaryInk);border-color:var(--primaryBg);font-weight:600}
.ctl[hidden]{display:none}
.ctl.loop::before{content:"";display:inline-block;width:12px;height:12px;border:1.5px solid var(--btnBorder);border-radius:3px;margin-right:8px;vertical-align:-1px}
.ctl.loop[aria-pressed=true]::before{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--btn)}
.foot{max-width:1360px;margin:0 auto;padding:6px 40px 36px}
.foot p{margin:0;font-size:12.5px;color:var(--soft);max-width:80ch}
/* what the plugin's renderers draw */
.box{display:flex;min-width:0}
.t{min-width:0}
.t.cut{overflow:hidden;text-overflow:ellipsis;white-space:pre}
.t.flow{white-space:pre-wrap;max-width:100%}
.btn{font-size:13px;line-height:18px;border-radius:8px;padding:3px 10px;border:1px solid;white-space:nowrap;flex:none}
.btn.plain{border:0;background:none;padding:0 4px}
.tbtn{white-space:pre;flex:none;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;line-height:inherit}
canvas,.sprite{display:block;image-rendering:pixelated}
.md img{display:block;max-width:100%;height:auto}
.reply{border:1px dashed var(--rule);border-radius:8px;min-height:54px;margin:6px 0 4px;width:100%;padding:10px 12px;align-items:center}
.desk .box img,.desk img{max-width:100%}
.inner.desk>.box{background:var(--band);border-radius:12px;padding:10px 12px}
.inner.desk.book>.box,.frame.book .inner.desk>.box{background:transparent;border-radius:0;padding:0}
.frame.chat .inner.desk>.box{background:transparent;padding:0}
@media (max-width:1099px){
 .main{grid-template-columns:1fr;row-gap:18px}
 .main>.cues{grid-column:1;grid-row:auto}
 .tabs{flex-wrap:wrap}
}
@media (max-width:999px){
 .names{flex-direction:column;gap:0;align-items:flex-start}
 .names .sub{white-space:normal;font-size:12.5px}
}
@media (max-width:700px){
 .top{padding:12px 16px;flex-wrap:wrap;row-gap:10px}
 .brand{flex:1 1 100%}
 .brand .alias,.seg{display:none}
 .tools{flex:1 1 100%;justify-content:flex-start}
 .hero{padding:10px 16px 0}.hero h1{font-size:26px}.hero p{font-size:15px}
 .main{padding:14px 16px 22px;row-gap:14px}
 .tabs{gap:2px}.tab{padding:6px 9px;font-size:13.5px}
 .frame{padding:22px 12px 16px;border-radius:12px}
 .surtitle{font-size:17px}
 .prompt{margin:0 10px}
 .grip{display:none}
 .foot{padding:4px 16px 28px}
 .allcues{display:inline-block}
 .cue{grid-template-columns:42px 1fr}
 .cuemark{left:18px;top:14px}
 button,.sel,.install,.cue{min-height:44px}
 .cue,.chip,.tab,.ctl,.install,.sel{display:inline-flex;align-items:center}
 .cue{display:grid;align-items:center}
 .controls{margin:12px 0 18px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

.still{display:block;margin:40px auto;max-width:60vw;height:auto}
.frame .still{margin:0 auto}
button:disabled{opacity:.55;cursor:default}
.nothere{margin:14px 0 0;font-size:12.5px;color:var(--stageSoft)}
</style>
</head>
